[project]
name = "callmemaybe"
version = "0.1.0"
description = "LLM Function Calling tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "llm-sdk",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
